<head>
    <meta charset="UTF-8">

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-topo">
                <span class="sidebar-marca">
                    <span class="sidebar-marca-icone">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
                    </span>
                    Delta Care
                </span>
            </div>

            <nav class="sidebar-nav">
                <a href="prof.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
                    Início
                </a>
                <a href="materiais.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2Z"/><path d="M12 6.5v13"/></svg>
                    Materiais
                </a>
                <a href="atividades.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg>
                    Atividades
                </a>
                <a href="calendario.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 9.5h18"/></svg>
                    Calendário
                </a>
                <a href="turmas.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14c2.7.3 4.5 2.6 4.5 6"/></svg>
                    Disciplinas
                </a>
                <a href="mensagens.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-8.9 8.5c-1.4 0-2.7-.3-3.9-.9L3 21l1.5-4.7A8.5 8.5 0 1 1 21 12Z"/></svg>
                    Chat
                </a>
                <a href="desempenho.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>
                    Desempenho
                </a>
                <a href="denuncias.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 16.5h.01"/><path d="M10.3 4.3 2.8 17a1.7 1.7 0 0 0 1.5 2.5h15.4a1.7 1.7 0 0 0 1.5-2.5L13.7 4.3a1.7 1.7 0 0 0-3 0Z"/></svg>
                    Denúncias
                </a>
                <a href="avisos.html" class="sidebar-link ativo">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1Z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
                    Avisos
                </a>
                <a href="historico.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>
                    Semestres anteriores
                </a>
            </nav>

            <footer class="sidebar-perfil">
                <span class="avatar" id="avatarRodape">--</span>
                <div class="sidebar-perfil-texto">
                    <strong id="nomeRodape">--</strong>
                    <div class="sidebar-perfil-acoes">
                        <button type="button" id="botaoPerfil" class="sidebar-perfil-link">Ver perfil</button>
                        <button type="button" id="botaoSair" class="sidebar-perfil-link">Sair</button>
                    </div>
                </div>
            </footer>
        </aside>

        <main class="conteudo">
            <header class="topo">
                <div class="topo-saudacao">
                    <h1>Avisos</h1>
                    <p>Escreva para as suas disciplinas. Quem recebe é avisado pelo sino.</p>
                </div>

                <div class="topo-acoes">
                    <div class="area-notificacoes">
                        <button type="button" class="botao-icone" id="botaoNotificacoes" aria-label="Notificacoes">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5Z"/><path d="M10.5 19a1.7 1.7 0 0 0 3 0"/></svg>
                        </button>
                    </div>
                </div>
            </header>

            <section class="cartao">
                <h2 class="cartao-titulo">Novo aviso</h2>
                <form id="formularioAviso" class="formulario">
                    <div id="blocoDestino">
                        <div class="campo" id="blocoDisciplinas">
                            <div class="aviso-disciplinas-topo">
                                <span>Para quais disciplinas</span>
                                <button type="button" class="acao acao--discreta" id="marcarTodas">Todas</button>
                            </div>
                            <div class="aviso-disciplinas" id="listaDisciplinas">Carregando...</div>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="avisoTitulo">Título</label>
                        <input type="text" id="avisoTitulo" maxlength="120" required>
                    </div>
                    <div class="campo">
                        <label for="avisoConteudo">Texto</label>
                        <textarea id="avisoConteudo" rows="4" maxlength="4000" required></textarea>
                    </div>
                    <label class="aviso-marca">
                        <input type="checkbox" id="avisoUrgente">
                        Urgente <span class="campo-dica">— fica no topo do mural por 7 dias</span>
                    </label>
                    <div class="campo campo--acoes">
                        <button type="submit" class="acao acao--primaria">Enviar aviso</button>
                    </div>
                </form>
                <p class="formulario-mensagem" id="avisoMensagem"></p>
            </section>

            <section class="cartao">
                <h2 class="cartao-titulo">Enviados</h2>
                <div class="avisos-lista" id="listaEnviados"></div>
            </section>

            <section class="cartao">
                <h2 class="cartao-titulo">Recebidos</h2>
                <div class="avisos-lista" id="listaRecebidos"></div>
            </section>
        </main>
    </div>

    <script src="../config.js?v=27"></script>
    <script src="../dialogo.js?v=27"></script>
    <script src="../visualizador.js?v=27"></script>
    <script src="../auth.js?v=27"></script>
    <script src="../perfil.js?v=27"></script>
    <script src="../notificacoes.js?v=27"></script>
    <script src="../avisos.js?v=27"></script>
</body>
</html>
