<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Care | Login</title>
    <link rel="stylesheet" href="style_index.css">
</head>
<body>
    <form>
        <h1>Delta Care</h1>
        <p class="subtitulo">Entre com sua conta para continuar</p>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        <a href="#" id="esqueciSenha">Esqueci minha senha</a>
        <p id="mensagem" role="alert"></p>
    </form>
    <script src="script.js"></script>
</body>
</html>
