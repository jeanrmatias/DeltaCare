<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Care | Materiais</title>
    <link rel="stylesheet" href="../style_dashboard.css?v=11">
    <link rel="stylesheet" href="../style_aluno.css?v=11">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-topo">
                <span class="sidebar-marca">
                    <span class="sidebar-marca-icone">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
                    </span>
                    Delta Care
                </span>
            </div>

            <nav class="sidebar-nav">
                <a href="inicio.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
                    Início
                </a>
                <a href="aluno.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-8.9 8.5c-1.4 0-2.7-.3-3.9-.9L3 21l1.5-4.7A8.5 8.5 0 1 1 21 12Z"/></svg>
                    Chat de estudos
                </a>
                <a href="materiais.html" class="sidebar-link ativo">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2Z"/><path d="M12 6.5v13"/></svg>
                    Materiais
                </a>
                <a href="em-breve.html?modulo=atividades-aluno" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg>
                    Atividades
                </a>
                <a href="em-breve.html?modulo=desempenho-aluno" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>
                    Desempenho
                </a>
                <a href="em-breve.html?modulo=denunciar-conteudo" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 16.5h.01"/><path d="M10.3 4.3 2.8 17a1.7 1.7 0 0 0 1.5 2.5h15.4a1.7 1.7 0 0 0 1.5-2.5L13.7 4.3a1.7 1.7 0 0 0-3 0Z"/></svg>
                    Denúncias
                </a>
            </nav>

            <div class="sidebar-perfil">
                <span class="avatar" id="avatarRodape">--</span>
                <div class="sidebar-perfil-texto">
                    <strong id="nomeRodape">--</strong>
                    <div class="sidebar-perfil-acoes">
                        <button type="button" id="botaoPerfil" class="sidebar-perfil-link">Ver perfil</button>
                        <button type="button" id="botaoSair" class="sidebar-perfil-link">Sair</button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="conteudo">
            <header class="topo">
                <div class="topo-saudacao">
                    <h1>Materiais</h1>
                    <p>Tudo que os seus professores já liberaram nas turmas em que você está matriculado.</p>
                </div>

                <div class="topo-acoes">
                    <div class="area-notificacoes">
                        <button type="button" class="botao-icone" id="botaoNotificacoes" aria-label="Notificações">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5Z"/><path d="M10.5 19a1.7 1.7 0 0 0 3 0"/></svg>
                        </button>
                    </div>
                    <label class="campo campo--seletor" id="seletorTurmaCampo" hidden>
                        <select id="seletorTurma"></select>
                    </label>
                    <label class="busca">
                        <input type="search" id="campoBusca" placeholder="Buscar por título, assunto ou tópico...">
                    </label>
                </div>
            </header>

            <!-- Filtros combinados: com o semestre inteiro publicado, a lista
                 plana vira rolagem infinita. As opções são montadas a partir do
                 que existe de fato nos materiais, não de uma lista fixa. -->
            <section class="filtros-materiais" id="filtrosMateriais" hidden>
                <label class="campo campo--filtro">
                    <span>Assunto</span>
                    <select id="filtroAssunto"><option value="">Todos</option></select>
                </label>

                <label class="campo campo--filtro">
                    <span>Tópico</span>
                    <select id="filtroTopico"><option value="">Todos</option></select>
                </label>

                <label class="campo campo--filtro">
                    <span>Tipo</span>
                    <select id="filtroTipo"><option value="">Todos</option></select>
                </label>

                <label class="campo campo--filtro">
                    <span>Período</span>
                    <select id="filtroPeriodo">
                        <option value="">Qualquer data</option>
                        <option value="7">Últimos 7 dias</option>
                        <option value="30">Últimos 30 dias</option>
                        <option value="90">Últimos 3 meses</option>
                    </select>
                </label>

                <button type="button" class="acao" id="botaoLimparFiltros">Limpar</button>
            </section>

            <p class="estado-vazio" id="estadoVazio" hidden></p>

            <section class="cartao" id="cartaoMateriais" hidden>
                <div class="lista-materiais" id="listaMateriais"></div>
            </section>
        </main>
    </div>

    <script src="../config.js?v=11"></script>
    <script src="../dialogo.js?v=11"></script>
    <script src="../visualizador.js?v=11"></script>
    <script src="../auth.js?v=11"></script>
    <script src="../perfil.js?v=11"></script>
    <script src="../notificacoes.js?v=11"></script>
    <script src="materiais.js?v=11"></script>
</body>
</html>
