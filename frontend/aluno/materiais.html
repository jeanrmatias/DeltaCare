<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Care | Materiais</title>
    <link rel="stylesheet" href="../style_dashboard.css?v=3">
    <link rel="stylesheet" href="../style_aluno.css?v=3">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-topo">
                <span class="sidebar-marca">
                    <span class="sidebar-marca-icone">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
                    </span>
                    Delta Care
                </span>
            </div>

            <nav class="sidebar-nav">
                <a href="inicio.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
                    Início
                </a>
                <a href="aluno.html" class="sidebar-link">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-8.9 8.5c-1.4 0-2.7-.3-3.9-.9L3 21l1.5-4.7A8.5 8.5 0 1 1 21 12Z"/></svg>
                    Chat de estudos
                </a>
                <a href="materiais.html" class="sidebar-link ativo">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2Z"/><path d="M12 6.5v13"/></svg>
                    Materiais
                </a>
                <a href="#" class="sidebar-link" data-em-breve="Atividades">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg>
                    Atividades
                </a>
                <a href="#" class="sidebar-link" data-em-breve="Desempenho">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>
                    Desempenho
                </a>
            </nav>

            <div class="sidebar-perfil">
                <span class="avatar" id="avatarRodape">--</span>
                <div class="sidebar-perfil-texto">
                    <strong id="nomeRodape">Aluno</strong>
                    <button type="button" id="botaoSair" class="sidebar-perfil-sair">Sair</button>
                </div>
            </div>
        </aside>

        <main class="conteudo">
            <header class="topo">
                <div class="topo-saudacao">
                    <h1>Materiais</h1>
                    <p>Tudo que os seus professores já liberaram nas turmas em que você está matriculado.</p>
                </div>

                <div class="topo-acoes">
                    <label class="campo campo--seletor" id="seletorTurmaCampo" hidden>
                        <select id="seletorTurma"></select>
                    </label>
                    <label class="busca">
                        <input type="search" id="campoBusca" placeholder="Buscar por título, assunto ou tópico...">
                    </label>
                </div>
            </header>

            <p class="estado-vazio" id="estadoVazio" hidden></p>

            <section class="cartao" id="cartaoMateriais" hidden>
                <div class="lista-materiais" id="listaMateriais"></div>
            </section>
        </main>
    </div>

    <script src="../config.js?v=3"></script>
    <script src="../auth.js?v=3"></script>
    <script src="materiais.js?v=3"></script>
</body>
</html>
