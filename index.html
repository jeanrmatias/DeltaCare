<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hospital Moinhos de Vento</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <section class="login-card">
            <div class="badge">Versão Beta</div>
            <h1>Login</h1>
            <p>Acesse o sistema do Hospital Moinhos de Vento</p>
            <form id="loginForm">
                <div class="form-group"><label for="email">E-mail</label><input type="email" id="email" required
                        placeholder="seu@email.com"></div>
                <div class="form-group"><label for="password">Senha</label><input type="password" id="password" required
                        placeholder="••••••••"></div>
                <div class="checkbox-group"><input type="checkbox" id="lgpd" required><label for="lgpd">Concordo com a
                        política de privacidade e LGPD</label></div><button type="submit">Entrar</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
